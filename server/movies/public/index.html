<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0c0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movies">
<title>Movies</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>Movies</h1>
    <button class="icon-btn" id="btnSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68 1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab active" data-list="collection">Collection <span id="cntCollection"></span></button>
    <button class="tab" data-list="wishlist">Wishlist <span id="cntWishlist"></span></button>
  </div>
  <div class="searchrow">
    <input id="q" type="search" placeholder="Search titles, barcodes, notes…" autocomplete="off">
    <select id="sort" aria-label="Sort">
      <option value="title">A–Z</option>
      <option value="added">Newest</option>
      <option value="year">Year</option>
    </select>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-f="kind" data-v="Movie">Movies</button>
    <button class="chip" data-f="kind" data-v="TV">TV</button>
    <button class="chip" data-f="kind" data-v="Kids">Kids</button>
    <button class="chip" data-f="ripped" data-v="yes">Ripped</button>
    <button class="chip" data-f="ripped" data-v="no">Not ripped</button>
    <button class="chip" data-f="k4" data-v="1">4K</button>
    <select class="chip select" id="toteFilter" aria-label="Tote"><option value="">Any tote</option></select>
  </div>
  <div class="stat" id="stat"></div>
</header>

<main id="grid" class="grid"></main>
<div id="empty" class="empty" hidden></div>

<div class="fabs">
  <button class="fab small" id="btnAdd" aria-label="Add by title">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  </button>
  <button class="fab" id="btnScan">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
    Scan
  </button>
</div>

<!-- generic sheet -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog">
  <div class="grab"></div>
  <button class="close" id="sheetClose" aria-label="Close">×</button>
  <div id="sheetBody"></div>
</section>

<div class="toast" id="toast" hidden></div>
<div class="confirm" id="confirm" hidden>
  <div class="confirm-card">
    <p id="confirmMsg"></p>
    <div class="confirm-btns"><button class="btn ghost" id="confirmNo">Keep it</button><button class="btn primary" id="confirmYes">Yes</button></div>
  </div>
</div>

<div class="auth" id="auth" hidden></div>

<script src="app.js"></script>
</body>
</html>
